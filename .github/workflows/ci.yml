name: Validate application
on:
  push:
    branches: [main, improve/**]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip check
      - run: black --check src dashboards scripts tests
      - run: ruff check src dashboards scripts tests
      - run: python -m src.data.pipeline
      - run: python -m src.models.train
      - run: pytest -v --cov=src --cov-report=term-missing
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation
          path: reports/evaluation.json
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build -t healthcare-analytics:test .
