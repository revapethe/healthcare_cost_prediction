services:
  api:
    build: .
    ports:
      - "8000:8000"
  dashboard:
    build: .
    command: ["streamlit", "run", "dashboards/main_dashboard.py", "--server.address=0.0.0.0", "--server.headless=true"]
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
